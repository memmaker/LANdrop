name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go install fyne.io/tools/cmd/fyne@latest
      - if: runner.os == 'macOS'
        run: |
          fyne package -os darwin -release
          zip -r landrop-macos.zip LANdrop.app   # zip keeps the executable bit
      - if: runner.os == 'Windows'
        run: |
          fyne package -os windows -release
          Compress-Archive LANdrop.exe landrop-windows.zip
      - uses: actions/upload-artifact@v6
        with:
          name: landrop-${{ runner.os }}
          path: landrop-*.zip
  release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v6
        with:
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "LANdrop $TAG" --notes "Built from $GITHUB_SHA" ${{ github.ref_type != 'tag' && '--prerelease' || '' }}
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber landrop-macos.zip landrop-windows.zip
