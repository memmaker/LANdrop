name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - id: go
        shell: bash
        run: echo "cache=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
      # setup-go's cache is saved once per go.sum and never refreshed, so the
      # release-tag cgo build never got cached. This key is unique per commit and
      # falls back to the newest previous one, so every run saves a fresh cache.
      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/go/bin
            ${{ steps.go.outputs.cache }}
          key: go-${{ runner.os }}-${{ hashFiles('go.sum', '.github/workflows/build.yml') }}-${{ github.sha }}
          restore-keys: go-${{ runner.os }}-${{ hashFiles('go.sum', '.github/workflows/build.yml') }}-
      - run: go test ./...
      - run: go install fyne.io/tools/cmd/fyne@v1.7.3
      - if: runner.os == 'macOS'
        run: |
          fyne package -os darwin -release
          zip -r landrop-macos.zip LANdrop.app   # zip keeps the executable bit
      - if: runner.os == 'Windows'
        run: |
          fyne package -os windows -release
          Compress-Archive LANdrop.exe landrop-windows.zip
      - uses: actions/upload-artifact@v6
        with:
          name: landrop-${{ runner.os }}
          path: landrop-*.zip
  release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v6
        with:
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "LANdrop $TAG" --notes "Built from $GITHUB_SHA" ${{ github.ref_type != 'tag' && '--prerelease' || '' }}
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber landrop-macos.zip landrop-windows.zip
