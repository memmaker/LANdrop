name: build
on: [push, pull_request]
jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go build -ldflags="-s -w" -o landrop${{ runner.os == 'Windows' && '.exe' || '' }} .
      - uses: actions/upload-artifact@v5
        with:
          name: landrop-${{ runner.os }}
          path: landrop*
