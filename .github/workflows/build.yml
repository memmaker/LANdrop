name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - {os: macos-latest, target: macos}
          - {os: windows-latest, target: windows}
          - {os: windows-latest, target: win7}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      # Upstream Go dropped Windows 7 after 1.20; this fork restores it.
      - if: matrix.target == 'win7'
        shell: bash
        run: |
          curl -sSfL -o go7.zip https://github.com/thongtech/go-legacy-win7/releases/download/v1.26.10-1/go-legacy-win7-1.26.10-1.windows_amd64.zip
          unzip -q go7.zip -d "$RUNNER_TEMP" && rm go7.zip
          echo "$(cygpath -w "$RUNNER_TEMP"/go*/bin)" >> "$GITHUB_PATH"
          echo GOTOOLCHAIN=local >> "$GITHUB_ENV"
      - id: go
        shell: bash
        run: echo "cache=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
      # setup-go's cache is saved once per go.sum and never refreshed, so the
      # release-tag cgo build never got cached. This key is unique per commit and
      # falls back to the newest previous one, so every run saves a fresh cache.
      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/go/bin
            ${{ steps.go.outputs.cache }}
          key: go-${{ matrix.target }}-${{ hashFiles('go.sum', '.github/workflows/build.yml') }}-${{ github.sha }}
          restore-keys: go-${{ matrix.target }}-${{ hashFiles('go.sum', '.github/workflows/build.yml') }}-
      - run: go test ./...
      - run: go install fyne.io/tools/cmd/fyne@v1.7.3
      - if: runner.os == 'macOS'
        run: |
          fyne package -os darwin -release
          zip -r landrop-macos.zip LANdrop.app   # zip keeps the executable bit
      - if: runner.os == 'Windows'
        run: |
          go version
          fyne package -os windows -release
          Compress-Archive LANdrop.exe landrop-${{ matrix.target }}.zip
      - uses: actions/upload-artifact@v6
        with:
          name: landrop-${{ matrix.target }}
          path: landrop-*.zip
  release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v6
        with:
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
        run: |
          if [ "$TAG" = latest ]; then  # rolling release: recreate so tag, date and notes follow main
            gh release delete latest -R "$GITHUB_REPOSITORY" --cleanup-tag -y || true
            gh release create latest -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
              --title "LANdrop latest ($(date -u +%Y-%m-%d))" --notes "Rolling build of main at $GITHUB_SHA. Tag a version (v1.0.0) for a stable release." \
              landrop-*.zip
          else
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "LANdrop $TAG" --generate-notes landrop-*.zip
          fi
